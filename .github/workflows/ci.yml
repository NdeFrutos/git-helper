name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Subir esta versión invalida toda la caché de Cargo cuando cambia el diseño
  # de la propia caché (rutas cacheadas, pasos o flags del runner).
  CARGO_CACHE_VERSION: v2
  CARGO_WIX_VERSION: 0.3.9

jobs:
  checks:
    name: Checks
    runs-on: windows-latest

    steps:
      - name: Start timing
        id: clock
        shell: pwsh
        run: '"started_at=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo checks
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          # Do not include github.ref: the default branch cache is available
          # to pull requests and release/tag workflows through this key.
          # El primer hash cubre el entorno de compilación (toolchain y flags del
          # linker); el segundo, las entradas que determinan qué se compila y con
          # qué perfil (Cargo.toml incluye [profile.*] y la metadata de WiX).
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ env.CARGO_CACHE_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ env.CARGO_CACHE_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ env.CARGO_CACHE_VERSION }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Record checks cache metrics
        if: always()
        shell: pwsh
        env:
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./.github/scripts/report-cargo-cache.ps1 -Phase "Checks" -StartedAt $env:STARTED_AT

  warm-release-cache:
    name: Warm release cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Start timing
        id: clock
        shell: pwsh
        run: '"started_at=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo release
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          # This is intentionally the same key and path used by releases.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ env.CARGO_CACHE_VERSION }}-wix${{ env.CARGO_WIX_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ env.CARGO_CACHE_VERSION }}-wix${{ env.CARGO_WIX_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ env.CARGO_CACHE_VERSION }}-wix${{ env.CARGO_WIX_VERSION }}-

      - name: Build release executable
        run: cargo build --release --locked

      - name: Install cargo-wix
        shell: pwsh
        run: ./.github/scripts/ensure-cargo-wix.ps1 -Version $env:CARGO_WIX_VERSION

      - name: Record warm-up cache metrics
        if: always()
        shell: pwsh
        env:
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./.github/scripts/report-cargo-cache.ps1 -Phase "Warm release cache" -StartedAt $env:STARTED_AT
