[package]
name = "git-helper"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Aplicación de escritorio nativa para Windows para trabajar con varios repositorios Git"
authors = ["Git Helper contributors"]
license = "Apache-2.0"
repository = "https://github.com/NdeFrutos/git-helper"
publish = false

[[bin]]
name = "ghelper"
path = "src/bin/ghelper.rs"

[package.metadata.wix]
eula = false
license = "LICENSE"
product-icon = "assets/icon.ico"
upgrade-guid = "A7C3E1F4-9B2D-4E6A-8C0F-1D5B7E9A3C24"
path-guid = "F2B8D4A6-3E1C-4F7B-9D0A-6C8E2F4B1A59"

[dependencies]
async-channel = "2.5.0"
directories = "6.0.0"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "5896274168e06663568f42b5bae142162936e0a6", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "5896274168e06663568f42b5bae142162936e0a6" }
notify = "8.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.19.1"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.19"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dev]
codegen-units = 16
debug = "limited"

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

[profile.dev.package.cosmic-text]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
# Habilita ganchos solo para mediciones de rendimiento (p. ej. GH_PERF_OPEN_REPO).
# No debe activarse en los binarios publicados.
perf-hooks = []

[[example]]
name = "bench"
path = "examples/bench.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
